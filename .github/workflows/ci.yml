name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      - name: Run shared checks
        run: just check
      - name: Prepare Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Exercise native credential storage on Linux
        if: runner.os == 'Linux'
        env:
          KANEO_NATIVE_KEYRING_TEST: '1'
        run: |
          dbus-run-session -- bash -e <<'KEYRING'
            GNOME_KEYRING_CONTROL=$(mktemp -d)
            export GNOME_KEYRING_CONTROL
            printf "%s" synthetic-ci-unlock | gnome-keyring-daemon --unlock --components=secrets
            go test ./internal/auth -run TestNativeKeyring -count=1 -v
          KEYRING
      - name: Exercise native credential storage on macOS and Windows
        if: runner.os != 'Linux'
        env:
          KANEO_NATIVE_KEYRING_TEST: '1'
        run: go test ./internal/auth -run TestNativeKeyring -count=1 -v

  cross:
    name: Cross-build release targets
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      - name: Build all release targets
        run: just cross

  release:
    name: Release
    needs:
      - verify
      - cross
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    with:
      verified_sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
