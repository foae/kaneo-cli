name: release

on:
  workflow_call:
    inputs:
      verified_sha:
        description: Exact SHA that the caller verified and cross-built.
        required: true
        type: string

# The caller grants these permissions explicitly. This workflow is only called
# from trusted main CI after verify and cross complete for the exact SHA.
permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: kaneo-cli-release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.readiness.outputs.enabled }}
    steps:
      - name: Check out the verified SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.verified_sha }}
          fetch-depth: 0
      - name: Assert caller and checkout SHA agree
        env:
          EXPECTED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - id: readiness
        name: Read the reviewed release gate
        run: |
          set -euo pipefail
          enabled=$(jq -r '.enabled | if type == "boolean" then . else error("enabled must be boolean") end' release/readiness.json)
          jq -e '.requiredEvidence | type == "array" and length >= 5' release/readiness.json >/dev/null
          printf 'enabled=%s\n' "$enabled" >>"$GITHUB_OUTPUT"

  publish:
    needs: gate
    # This is the mechanical disabled-by-default gate: no tag, publishing,
    # attestation, or formula PR job can run unless reviewed readiness is true.
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the verified SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.verified_sha }}
          fetch-depth: 0
      - name: Assert exact SHA before every remote mutation
        env:
          EXPECTED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install and verify pinned svu
        env:
          SVU_VERSION: v3.4.1
        run: |
          set -euo pipefail
          go install github.com/caarlos0/svu/v3@"$SVU_VERSION"
          go version -m "$(go env GOPATH)/bin/svu" | awk '$1 == "mod" && $2 == "github.com/caarlos0/svu/v3" && $3 == "v3.4.1" { found = 1 } END { exit !found }'
      - id: version
        name: Plan the release version
        env:
          EXPECTED_SHA: ${{ inputs.verified_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          plan=$(go run ./internal/cmd/release plan --json)
          releasing=$(jq -er '.release | tostring' <<<"$plan")
          current=$(jq -r '.currentTag // ""' <<<"$plan")
          if test -n "$current" && test "$(git rev-parse "$current^{}")" = "$EXPECTED_SHA"; then
            test "$(release/recover.sh "$current" "$EXPECTED_SHA")" = complete
          fi
          printf 'release=%s\n' "$releasing" >>"$GITHUB_OUTPUT"
          if test "$releasing" = false; then exit 0; fi
          version=$(jq -er '.nextTag' <<<"$plan")
          # Stable bumps use the pinned svu policy; first release is explicitly v1.0.0.
          configured=$(svu next)
          if jq -e '.currentTag // "" | length > 0' <<<"$plan" >/dev/null; then
            test "$version" = "$configured"
          else
            test "$version" = v1.0.0
          fi
          printf 'tag=%s\n' "$version" >>"$GITHUB_OUTPUT"
      - name: Set up just
        if: steps.version.outputs.release == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      - name: Set up container builder
        if: steps.version.outputs.release == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Preflight release artifacts before creating a tag
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          just snapshot
          bash release/container.sh smoke "$TAG" "$EXPECTED_SHA"
      - id: recovery
        if: steps.version.outputs.release == 'true'
        name: Refuse ambiguous same-tag recovery
        env:
          EXPECTED_SHA: ${{ inputs.verified_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          state=$(release/recover.sh '${{ steps.version.outputs.tag }}' "$EXPECTED_SHA")
          printf 'state=%s\n' "$state" >>"$GITHUB_OUTPUT"
      - name: Create immutable release tag
        if: steps.recovery.outputs.state == 'fresh'
        env:
          EXPECTED_SHA: ${{ inputs.verified_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$TAG" "$EXPECTED_SHA" --message "Release $TAG"
          git push origin "refs/tags/$TAG"
      - name: Publish immutable archives and checksums
        if: steps.recovery.outputs.state == 'fresh'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest published artifacts
        if: steps.recovery.outputs.state == 'fresh'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: kaneo-cli-release-artifacts
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/kaneo-cli_*_checksums.txt
      - name: Log in to the package registry
        if: steps.recovery.outputs.state == 'fresh'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: container
        name: Publish versioned container after GitHub assets
        if: steps.recovery.outputs.state == 'fresh'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_SHA: ${{ inputs.verified_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash release/container.sh publish "$TAG" "$EXPECTED_SHA"
      - name: Verify published container identity
        if: steps.recovery.outputs.state == 'fresh'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_SHA: ${{ inputs.verified_sha }}
          DIGEST: ${{ steps.container.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./internal/cmd/registry verify "$TAG" "$EXPECTED_SHA" "$DIGEST"
      - name: Record the published container digest in release notes
        if: steps.recovery.outputs.state == 'fresh'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.container.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body >"$notes"
          printf '\nContainer digest: %s\n' "$DIGEST" >>"$notes"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          rm "$notes"
      - name: Attest container identity
        if: steps.recovery.outputs.state == 'fresh'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/foae/kaneo-cli
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true
      - name: Verify anonymous container availability
        if: steps.recovery.outputs.state == 'fresh'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_SHA: ${{ inputs.verified_sha }}
          DIGEST: ${{ steps.container.outputs.digest }}
          GITHUB_TOKEN: ''
        run: go run ./internal/cmd/registry verify "$TAG" "$EXPECTED_SHA" "$DIGEST"
      - name: Generate a formula from published checksums
        if: steps.recovery.outputs.state == 'fresh'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = foae/kaneo-cli
          release/formula.sh "$TAG" Formula/kaneo-cli.rb
      - name: Open the formula update pull request
        if: steps.recovery.outputs.state == 'fresh'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TAP_URL: https://github.com/foae/kaneo-cli
        run: |
          set -euo pipefail
          branch="chore/homebrew-${TAG}"
          test "$GITHUB_REPOSITORY" = foae/kaneo-cli
          test -z "$(git ls-remote --heads origin "$branch")" || { printf '%s\n' "formula branch already exists: $branch" >&2; exit 1; }
          git switch --create "$branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/kaneo-cli.rb
          git commit --message "chore(homebrew): update kaneo-cli ${TAG}"
          git push origin "$branch"
          body=$(printf "Generated from immutable release checksums for %s. Tap: %s; install with brew install foae/kaneo-cli/kaneo-cli." "$TAG" "$TAP_URL")
          gh pr create --repo foae/kaneo-cli --base main --head "$branch" --title "chore(homebrew): update kaneo-cli ${TAG}" --body "$body"
