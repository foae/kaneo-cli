version: 2
project_name: kaneo-cli

builds:
  - id: kaneo-cli
    main: ./cmd/kaneo-cli
    binary: kaneo-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/foae/kaneo-cli/internal/buildinfo.Version={{ .Version }} -X github.com/foae/kaneo-cli/internal/buildinfo.Commit={{ .Commit }} -X github.com/foae/kaneo-cli/internal/buildinfo.Date={{ .Date }}

archives:
  - id: default
    ids:
      - kaneo-cli
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE

nfpms:
  - id: native
    ids:
      - kaneo-cli
    package_name: kaneo-cli
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    homepage: https://github.com/foae/kaneo-cli
    maintainer: foae <foae@users.noreply.github.com>
    description: unofficial Kaneo CLI
    license: MIT
    dependencies:
      - ca-certificates
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/kaneo-cli/LICENSE
        packager: rpm
      - src: LICENSE
        dst: /usr/share/doc/kaneo-cli/copyright
        packager: deb

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

source:
  enabled: false

release:
  github:
    owner: foae
    name: kaneo-cli
  header: |
    Unofficial JSON-first Kaneo CLI. The release configuration includes Linux, macOS and Windows archives for amd64 and arm64, native Linux packages, and a multi-architecture container image.

    All 162 pinned operations have command mappings. GitHub, Gitea, Slack, Discord, Mattermost and Telegram integrations are fixture-tested, **not live-provider verified**; live-provider acceptance was explicitly deferred for v1.0.0.

    See [verification evidence](https://github.com/foae/kaneo-cli/blob/{{ .Tag }}/docs/verification.md) and [API compatibility notes](https://github.com/foae/kaneo-cli/blob/{{ .Tag }}/docs/api/README.md).

    Homebrew installation (after the generated Formula PR merges):
    ```
    brew tap foae/kaneo-cli https://github.com/foae/kaneo-cli
    brew install foae/kaneo-cli/kaneo-cli
    ```
