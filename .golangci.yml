version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  # Explicit list: upgrades must not silently introduce new policy.
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - nilerr
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    # Keep correctness checks active in tests as well as production code.
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
