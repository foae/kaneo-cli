# Disposable acceptance environment only. Never deploy these test credentials.
# Pins audited 2026-09-24 (Kaneo 2.27.0); image identity is not API-spec compatibility proof.
services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: kaneo
      POSTGRES_USER: kaneo
      POSTGRES_PASSWORD: local-acceptance-only
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kaneo -d kaneo]
      interval: 2s
      timeout: 5s
      retries: 30
  kaneo:
    image: ghcr.io/usekaneo/kaneo@sha256:51178ddb9010f5beb2e32e93f84234ecf408a751764b9d3f85582ed87355901e
    ports:
      - "127.0.0.1:15173:5173"
      - "127.0.0.1:19000:19000"
      - "127.0.0.1:19001:19001"
    environment:
      KANEO_CLIENT_URL: http://localhost:15173
      KANEO_API_URL: http://localhost:15173/api
      POSTGRES_DB: kaneo
      POSTGRES_USER: kaneo
      POSTGRES_PASSWORD: local-acceptance-only
      AUTH_SECRET: local-acceptance-only-not-for-production-0123456789abcdef
      DEVICE_AUTH_CLIENT_IDS: kaneo-cli
      DISABLE_EMAIL_OTP_SIGN_IN: "true"
      S3_ENDPOINT: http://localhost:19000
      S3_BUCKET: kaneo-uploads
      S3_ACCESS_KEY_ID: acceptance
      S3_SECRET_ACCESS_KEY: local-acceptance-only
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:5173/api/health]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
  minio:
    build:
      context: .
      dockerfile: minio.Dockerfile
    # Share loopback so presigned localhost URLs work in both API and host clients.
    network_mode: service:kaneo
    command: server /data --address :19000 --console-address :19001
    environment:
      MINIO_ROOT_USER: acceptance
      MINIO_ROOT_PASSWORD: local-acceptance-only
    volumes:
      - minio_data:/data
volumes:
  postgres18_data:
  minio_data:
